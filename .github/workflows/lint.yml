name: Lint workflows and scripts

on:
  push:
    branches: [main]
    paths: [".github/workflows/**", "scripts/release/**"]
  pull_request:
    branches: [main]
    paths: [".github/workflows/**", "scripts/release/**"]

permissions:
  contents: read

jobs:
  lint:
    name: actionlint + shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: shellcheck release scripts
        run: shellcheck scripts/release/*.sh
      - name: actionlint
        run: |
          bash <(curl --proto '=https' --tlsv1.2 -fsSL \
            https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

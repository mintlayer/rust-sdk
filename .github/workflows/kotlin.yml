name: Kotlin AAR

on:
  pull_request:
    branches: [main]
    paths:
      - "bindings/**"
      - "scripts/kotlin/**"
      - ".github/workflows/kotlin.yml"
  push:
    branches: [main]
    paths:
      - "bindings/**"
      - "scripts/kotlin/**"
      - ".github/workflows/kotlin.yml"

permissions:
  contents: read

jobs:
  aar:
    name: Build AAR and run on-device acceptance (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_VERSION: "8.7"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@ffaa7fb73f2b6e3c49bc425913220fa3d71c3ee5 # 1.92.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install cargo-ndk (pinned)
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-ndk@3.5.0

      - name: Install Android NDK (pinned)
        uses: nttld/setup-ndk@2817442ee7c3346c1eb7d2ec60263c93206ba14f # v1
        id: ndk
        with:
          ndk-version: r27b
          add-to-path: false

      - name: Export NDK environment
        run: echo "ANDROID_NDK_HOME=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@6cfc8b8e8bb586cc164bef1c478c1eea3a4d6a19 # v3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false

      - name: Build AAR (3 ABIs + generated Kotlin)
        run: bash scripts/kotlin/build-aar.sh

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: mintlayer-wallet-bindings-aar
          path: bindings/kotlin/build/outputs/aar/*-release.aar
          if-no-files-found: error

      - name: Run on-device acceptance tests (emulator)
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: cd bindings/kotlin && gradle connectedDebugAndroidTest

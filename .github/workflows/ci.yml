name: CI

on:
  push:
    branches: [main]
    paths-ignore: [".github/**"]
  pull_request:
    branches: [main]
    paths-ignore: [".github/**"]

# The crate jobs never need more than read access.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Merge-time pin-order enforcement: a checksum-pin PR must not
  # downgrade the release pinned on the default branch. Runs on PRs
  # touching Package.swift; branch protection can require it.
  pin-order:
    name: Pin ordering
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Refuse a downgrading pin
        run: |
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -c '^Package.swift$' || true)"
          if [ "$changed" = "0" ]; then
            echo "Package.swift untouched; nothing to check"
            exit 0
          fi
          incoming="$(grep -oE 'let releaseTag = "wallet-bindings-v[0-9.]+[^"]*"' Package.swift | grep -oE '[0-9][^"]*' || true)"
          current="$(git show "origin/${{ github.base_ref }}:Package.swift" \
            | grep -oE 'let releaseTag = "wallet-bindings-v[0-9.]+[^"]*"' | grep -oE '[0-9][^"]*' || true)"
          if [ -z "$incoming" ]; then
            echo "::error::pin PR carries no parsable releaseTag"
            exit 1
          fi
          if [ -n "$current" ] \
            && [ "$(printf '%s\n%s\n' "$incoming" "$current" | sort -V | head -1)" != "$incoming" ]; then
            echo "::error::pin PR would downgrade the release from $current to $incoming"
            exit 1
          fi
          echo "pin order ok (incoming $incoming, current ${current:-none})"

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Pinned to the MSRV so rustfmt matches the version clippy/test use.
      - uses: dtolnay/rust-toolchain@ffaa7fb73f2b6e3c49bc425913220fa3d71c3ee5 # 1.92.0
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy (${{ matrix.features }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        features: ["--no-default-features", "--no-default-features --features node", "--no-default-features --features indexer", "--no-default-features --features wallet", "--no-default-features --features crypto", "--all-features"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@ffaa7fb73f2b6e3c49bc425913220fa3d71c3ee5 # 1.92.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.features }}
      - run: cargo clippy ${{ matrix.features }} --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.features }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        features: ["--no-default-features", "--no-default-features --features node", "--no-default-features --features indexer", "--no-default-features --features wallet", "--no-default-features --features crypto", "--all-features"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@ffaa7fb73f2b6e3c49bc425913220fa3d71c3ee5 # 1.92.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.features }}
      - run: cargo test ${{ matrix.features }} --locked

  # Cross-platform test gate, mirroring mintlayer-core's build.yml: the full
  # suite runs on every supported OS with the lockfile held fixed.
  platform-tests:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Shorten CARGO_HOME on Windows
        if: runner.os == 'Windows'
        shell: bash
        # The default path blows past the Windows MAX_PATH limit inside the
        # mintlayer-core git checkouts (same reason mintlayer-core's own
        # build.yml does this).
        run: echo "CARGO_HOME=C:\crg" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@ffaa7fb73f2b6e3c49bc425913220fa3d71c3ee5 # 1.92.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.os }}
      - run: cargo build --all-features --locked --examples
      - run: cargo test --all-features --locked

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@ffaa7fb73f2b6e3c49bc425913220fa3d71c3ee5 # 1.92.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo doc --all-features --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  differential-parity:
    name: Differential parity (wasm-lib 1.4.0)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@ffaa7fb73f2b6e3c49bc425913220fa3d71c3ee5 # 1.92.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/differential/package-lock.json
      - name: Generate fixtures from the wasm reference
        run: npm ci --prefix scripts/differential && node scripts/differential/generate-fixtures.cjs
      - name: Replay fixtures through the bindings
        run: cargo test --locked -p mintlayer-wallet-bindings --test differential
        env:
          DIFFERENTIAL_FIXTURES_REQUIRED: "1"

  license:
    name: License headers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-license.sh

name: CI

on:
  push:
    branches: [main, 'pin-spm-checksum-**']
    paths-ignore: [".github/**"]
  pull_request:
    branches: [main]
    paths-ignore: [".github/**"]

# The crate jobs never need more than read access.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Merge-time pin-order enforcement: a checksum-pin PR must not
  # downgrade the release pinned on the default branch. Runs on PRs
  # touching Package.swift; branch protection can require it.
  pin-order:
    name: Pin ordering
    # Covers human-opened pin PRs (pull_request) and manual/re-run pushes
    # to the reserved namespace (push). Bot pin PRs opened with
    # GITHUB_TOKEN do not emit either event; they are enforced at
    # creation time by the release workflow's rewind guard, which also
    # supersedes older open pin PRs.
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/pin-spm-checksum-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LC_ALL: C
    steps:
      # On pull_request events the gate code and the current pin state
      # come from the trusted base branch; PR content is only ever read
      # as data. On push events the pushed branch's code runs, which is
      # ordinary branch-CI privilege (read-only, no secrets) under the
      # documented force-push risk of the reserved namespace.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse a downgrading pin
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || github.event.repository.default_branch }}
          HEAD_REF: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Single comparison implementation (scripts/release/semver.sh),
          # comment-stripped strict extraction, annotation-safe echoes —
          # shared with the release scripts.
          if [[ ! "$BASE_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]; then
            echo "::error::unexpected base branch"
            exit 1
          fi
          # Any PR that edits Package.swift is order-checked, whatever
          # its head branch is named; reserved-namespace heads
          # additionally must pin exactly the release their branch name
          # declares (strict mode). NOTE: bot pin PRs opened with
          # GITHUB_TOKEN do not emit pull_request events; they are
          # enforced at creation time by the release workflow's rewind
          # guard, which also supersedes older open pin PRs (no
          # merge-order rewind).
          case "$HEAD_REF" in
            pin-spm-checksum-*)
              expected_tag="wallet-bindings-v${HEAD_REF#pin-spm-checksum-}"
              ;;
            *)
              expected_tag=""
              ;;
          esac
          if [ -n "$expected_tag" ] && [[ ! "$expected_tag" =~ ^wallet-bindings-v[0-9]{1,18}\.[0-9]{1,18}\.[0-9]{1,18}([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::derived tag does not match wallet-bindings-v<semver>"
            exit 1
          fi
          # Bind the incoming checksum to the release the pin names:
          # SPM refuses on integrity mismatch at resolve time, so an
          # unverifiable checksum would strand every consumer. The
          # release must already exist (the release job publishes it
          # before opening its pin PR) and its SHA256SUMS must list
          # exactly the XCFramework zip hash the head pins. Fail closed
          # on a missing or unreadable manifest.
          # shellcheck disable=SC1091  # sourced from the trusted base checkout
          source scripts/release/pinlib.sh
          head_swift="$(git show "${HEAD_SHA}:Package.swift")" \
            || { echo "::error::cannot read Package.swift from the PR head"; exit 1; }
          head_norm="$(strip_swift_comments "${head_swift}")"
          head_tag="$(printf '%s\n' "${head_norm}" | grep -E '^let releaseTag = ' | grep -oE 'wallet-bindings-v[^"]*' || true)"
          head_checksum="$(printf '%s\n' "${head_norm}" | grep -E '^checksum: "' | grep -oE '[0-9a-f]{64}' || true)"
          if [ "$(printf '%s\n' "${head_norm}" | grep -cE '^let releaseTag = ' || true)" != "1" ] \
            || [ "$(printf '%s\n' "${head_norm}" | grep -cE '^checksum: "[0-9a-f]{64}"$' || true)" != "1" ] \
            || [[ ! "${head_tag}" =~ ^wallet-bindings-v[0-9]{1,18}\.[0-9]{1,18}\.[0-9]{1,18}([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::PR head does not carry exactly one releaseTag and one hex checksum pin"
            exit 1
          fi
          sums="$(gh release download "${head_tag}" --pattern "SHA256SUMS" --output - 2>/dev/null)" \
            || { echo "::error::release is missing or carries no readable SHA256SUMS; refusing an unverifiable pin"; exit 1; }
          published="$(printf '%s\n' "${sums}" | grep 'MintlayerWalletBindings.xcframework.zip' | awk '{print $1}' || true)"
          if [ "${published}" != "${head_checksum}" ]; then
            echo "::error::pinned checksum does not match the published SHA256SUMS for $(esc "${head_tag}")"
            exit 1
          fi
          # The checkout is the base branch; pull the PR head commit so
          # the diff below and check-pin-order.sh's data-only read of
          # the head's Package.swift can see it (push events already
          # have their SHA locally).
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head"
          fi
          # Fail closed on diff errors: an unreadable head (e.g. a
          # force-push landing between event emission and the fetch)
          # must not masquerade as "Package.swift untouched". The head
          # fetch is anonymous, so private repositories fail closed
          # here rather than silently skipping the gate.
          if ! head_files="$(git diff --name-only "origin/${BASE_REF}...${HEAD_SHA}")"; then
            echo "::error::cannot diff the incoming pin against origin/${BASE_REF}"
            exit 1
          fi
          if ! printf '%s\n' "${head_files}" | grep -q '^Package.swift$'; then
            echo "Package.swift untouched; nothing to check"
            exit 0
          fi
          # Gate code is the trusted base checkout; the PR head's
          # Package.swift is consumed purely as data via its SHA.
          scripts/release/check-pin-order.sh "$BASE_REF" "$expected_tag" "$HEAD_SHA"

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # Pinned to the MSRV so rustfmt matches the version clippy/test use.
      - uses: dtolnay/rust-toolchain@ffaa7fb73f2b6e3c49bc425913220fa3d71c3ee5 # 1.92.0
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy (${{ matrix.features }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        features: ["--no-default-features", "--no-default-features --features node", "--no-default-features --features indexer", "--no-default-features --features wallet", "--no-default-features --features crypto", "--all-features"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ffaa7fb73f2b6e3c49bc425913220fa3d71c3ee5 # 1.92.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.features }}
      - run: cargo clippy ${{ matrix.features }} --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.features }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        features: ["--no-default-features", "--no-default-features --features node", "--no-default-features --features indexer", "--no-default-features --features wallet", "--no-default-features --features crypto", "--all-features"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ffaa7fb73f2b6e3c49bc425913220fa3d71c3ee5 # 1.92.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.features }}
      - run: cargo test ${{ matrix.features }} --locked

  # Cross-platform test gate, mirroring mintlayer-core's build.yml: the full
  # suite runs on every supported OS with the lockfile held fixed.
  platform-tests:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Shorten CARGO_HOME on Windows
        if: runner.os == 'Windows'
        shell: bash
        # The default path blows past the Windows MAX_PATH limit inside the
        # mintlayer-core git checkouts (same reason mintlayer-core's own
        # build.yml does this).
        run: echo "CARGO_HOME=C:\crg" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ffaa7fb73f2b6e3c49bc425913220fa3d71c3ee5 # 1.92.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.os }}
      - run: cargo build --all-features --locked --examples
      - run: cargo test --all-features --locked

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ffaa7fb73f2b6e3c49bc425913220fa3d71c3ee5 # 1.92.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo doc --all-features --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  differential-parity:
    name: Differential parity (wasm-lib 1.4.0)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ffaa7fb73f2b6e3c49bc425913220fa3d71c3ee5 # 1.92.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/differential/package-lock.json
      - name: Generate fixtures from the wasm reference
        run: npm ci --prefix scripts/differential && node scripts/differential/generate-fixtures.cjs
      - name: Replay fixtures through the bindings
        run: cargo test --locked -p mintlayer-wallet-bindings --test differential
        env:
          DIFFERENTIAL_FIXTURES_REQUIRED: "1"

  license:
    name: License headers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: ./scripts/check-license.sh
